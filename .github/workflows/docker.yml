name: docker

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build AMX base image
        run: docker build -f base/Dockerfile -t amx-base:ubuntu .
      - name: Build greeter example image
        run: |
          docker build -f examples/greeter/Dockerfile \
            --build-arg BASE_IMAGE=amx-base:ubuntu \
            -t amx-greeter-demo:ubuntu .
      - name: Build LED virtual-node test
        run: docker build -f examples/led/Dockerfile -t amx-led-test .
      - name: Run LED virtual-node test
        run: docker run --rm amx-led-test
      - name: Run demo and assert output
        run: |
          docker run -d --rm --name demo amx-greeter-demo:ubuntu
          sleep 3
          docker logs demo | tee /tmp/demo.log
          grep -q "Hello from AMX in Docker" /tmp/demo.log
          docker exec demo runuser -u demo -- ubus -s /var/run/ubus/ubus.sock -t 2 list | grep -qx Greeter
          docker stop demo
